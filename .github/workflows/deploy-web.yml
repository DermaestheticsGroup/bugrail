name: Deploy BugRail web (manual)

# Manual on purpose: deploying web/ replaces the running service, which is the cutover.
# Follow docs/runbook-cutover.md first (freeze, mongodump, migration); until then deploy.yml keeps deploying the old server/.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "cutover" to confirm the runbook steps are done'
        required: true

permissions:
  contents: read

# One deploy at a time: two runs would reset and build the same checkout.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'cutover'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy web/ to VM
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: itdev1
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/qa-monitor
            git fetch origin main
            git reset --hard origin/main
            cd web
            bun install --frozen-lockfile
            bun run build
            sudo systemctl restart bugrail
            sleep 3
            sudo systemctl is-active bugrail
            curl -fsS -o /dev/null http://127.0.0.1:3001/login
